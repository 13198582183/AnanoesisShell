        title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    ConversationCreate:
      type: object
      properties:
        host_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true

    SessionConversationCreate:
      type: object
      properties:
        title:
          type: string
          nullable: true

    ActiveConversationRequest:
      type: object
      required: [conversation_id]
      properties:
        conversation_id:
          type: string
          format: uuid

    Message:
      type: object
      description: 会话消息。V2 新增 seq/source/command_id/run_id
      required: [id, conversation_id, role, created_at]
      properties:
        id:
          type: string
          format: uuid
